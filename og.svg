<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="DoodhBook — daily delivery billing for milk, newspaper and water-can vendors. A KARYA studio build.">
  <title>DoodhBook — daily delivery, month-end sorted</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1B24"/>
      <stop offset="1" stop-color="#123246"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- accent side rule -->
  <rect x="0" y="0" width="14" height="630" fill="url(#accent)"/>

  <!-- brand row -->
  <g transform="translate(80,86)">
    <rect x="0" y="0" width="66" height="66" rx="16" fill="url(#accent)"/>
    <!-- milk bottle / ledger mark -->
    <path d="M27 13h12l2 6H25l2-6Z" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M23 19h20l-2 30a3 3 0 0 1-3 2.8H28a3 3 0 0 1-3-2.8L23 19Z" fill="#ffffff"/>
    <path d="M29 31h8M29 38h8M29 45h5" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
    <text x="88" y="46" font-family="Georgia,'Times New Roman',serif" font-size="34" font-weight="700" fill="#E3EEF3">Doodh<tspan fill="#7DD3FC">Book</tspan></text>
  </g>

  <!-- headline -->
  <text x="80" y="290" font-family="Georgia,'Times New Roman',serif" font-size="92" font-weight="800" fill="#FBF9F4" letter-spacing="-2">Daily delivery,</text>
  <text x="80" y="392" font-family="Georgia,'Times New Roman',serif" font-size="92" font-weight="800" fill="#38BDF8" letter-spacing="-2">month-end sorted.</text>

  <!-- tagline -->
  <text x="80" y="466" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="500" fill="#B9CAD6">Milk delivery billing app for milkman, newspaper</text>
  <text x="80" y="510" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="500" fill="#B9CAD6">&amp; water-can vendors — the daily count adds itself up.</text>

  <!-- footer wordmark + tags -->
  <rect x="80" y="556" width="1040" height="1.5" fill="#2A4457"/>
  <text x="80" y="596" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="800" letter-spacing="4" fill="#7DD3FC">KARYA</text>
  <text x="1120" y="596" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#8FA6B4">subscription · pricing on discovery</text>
</svg>
